<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Biblioteca del Campus</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-publica="true">

<main class="formulario-contenedor">
    <h1>📚 Biblioteca del Campus</h1>
    <p class="subtitulo">Inicia sesión para administrar el catálogo.</p>

    <form id="formLogin" autocomplete="off">
        <div>
            <label for="usuario">Usuario</label>
            <input id="usuario" type="text" placeholder="Escribe tu usuario" required>
        </div>

        <div>
            <label for="clave">Contraseña</label>
            <div class="campo-clave">
                <input id="clave" type="password" placeholder="Escribe tu contraseña" required>
                <button id="btnVerClave" type="button" class="secundario" aria-pressed="false">👁 Mostrar</button>
            </div>
        </div>

        <p id="mensajeLogin" role="alert"></p>

        <button type="submit">🔐 Ingresar</button>
    </form>
</main>

<script src="js/app.js"></script>
</body>
</html>
