<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar libro | Biblioteca del Campus</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<aside class="sidebar">
    <h2>📚 Biblioteca</h2>
    <p>Sesión: <strong id="nombreUsuario">ADMIN</strong></p>
    <nav aria-label="Menú principal">
        <a href="index.html">🏠 Inicio</a>
        <a href="catalogo.html">📖 Catálogo</a>
        <a href="registrar.html">➕ Registrar libro</a>
    </nav>
    <button type="button" id="btnModo">🌙 Modo nocturno</button>
    <button type="button" id="btnCerrarSesion">🚪 Cerrar sesión</button>
</aside>

<main class="contenido-principal">
    <header>
        <h1>Registrar libro</h1>
        <p class="subtitulo">Agrega un nuevo título al catálogo físico.</p>
    </header>

    <section aria-labelledby="tituloRegistro">
        <h2 id="tituloRegistro">➕ Datos del libro</h2>

        <form id="formRegistro" class="form-registro">
            <div class="campo">
                <label for="titulo">Título *</label>
                <input id="titulo" type="text" placeholder="Ej. Cien años de soledad" required>
            </div>

            <div class="campo">
                <label for="autor">Autor *</label>
                <input id="autor" type="text" placeholder="Ej. Gabriel García Márquez" required>
            </div>

            <div class="campo">
                <label for="isbn">ISBN</label>
                <input id="isbn" type="text" placeholder="Opcional">
            </div>

            <div class="campo">
                <label for="anio">Año de publicación</label>
                <input id="anio" type="number" min="1000" max="2100" placeholder="Ej. 1967">
            </div>

            <div class="campo">
                <label for="categoria">Categoría *</label>
                <select id="categoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option>Arte</option>
                    <option>Ciencias</option>
                    <option>Historia</option>
                    <option>Ingeniería</option>
                    <option>Literatura</option>
                    <option>Tecnología</option>
                    <option>Otra</option>
                </select>
            </div>

            <div class="campo">
                <label for="ejemplares">Ejemplares *</label>
                <input id="ejemplares" type="number" min="1" step="1" placeholder="Ej. 5" required>
            </div>

            <div class="acciones-formulario">
                <button type="submit">💾 Guardar libro</button>
                <button type="reset" class="secundario">🧹 Limpiar</button>
                <a class="boton secundario" href="catalogo.html">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<script src="js/app.js"></script>
<script src="js/libros.js"></script>
</body>
</html>
